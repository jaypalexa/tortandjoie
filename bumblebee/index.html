<!doctype html>
<html lang="en">
  <head>
    <title>Tort and Joie - Bumblebee</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="shortcut icon"
      type="image/png"
      href="/assets/images/bumblebee.png"
    />

    <style>
      body {
        background: lightyellow;
        font-family: Arial, sans-serif;
        padding: 12px;
      }

      input[type="text"] {
        font-size: 24px;
        text-transform: uppercase;
      }

      .letter-input {
        height: 35px;
        text-align: center;
      }

      #cameraInput {
        display: none;
      }

      .camera-button {
        display: inline-block;
        padding: 12px 18px;
        background: #f3c84b;
        border: 1px solid #98751b;
        border-radius: 8px;
        font-size: 17px;
        cursor: pointer;
      }

      #scanStatus {
        margin-top: 12px;
        white-space: pre-wrap;
      }

      #photoPreview {
        display: none;
        max-width: 100%;
        max-height: 400px;
        margin-top: 12px;
      }
    </style>
  </head>

  <body>
    <p>
      <img
        src="/assets/images/bumblebee.png"
        height="32"
        width="32"
        alt="Bumblebee"
      />
    </p>

    <h2>Spelling Bee Scanner</h2>

    <p>
      <label class="camera-button" for="cameraInput">
        📷 Take photo &amp; scan
      </label>
      <input
        id="cameraInput"
        type="file"
        accept="image/*"
        capture="environment"
      />
    </p>

    <img id="photoPreview" alt="Photo to scan" />

    <p id="scanStatus" role="status">
      Take a photo of the puzzle to recognise its letters.
    </p>

    <form name="mainForm">
      <p>
        <label for="centerLetter">Center letter:</label>
        <input
          id="centerLetter"
          type="text"
          name="centerLetter"
          maxlength="1"
          class="letter-input"
          style="width: 35px"
        />
      </p>

      <p>
        <label for="otherLetters">Other letters:</label>
        <input
          id="otherLetters"
          type="text"
          name="otherLetters"
          maxlength="6"
          style="width: 150px"
        />
      </p>

      <p>
        <label for="minLength">Minimum length:</label>
        <input
          id="minLength"
          type="number"
          name="minLength"
          value="4"
          style="width: 50px"
        />
      </p>

      <p>
        <input
          type="button"
          value="Search Dictionary 1 (big)"
          onclick="findValidWords(1)"
        />
      </p>

      <p>
        <input
          type="button"
          value="Search Dictionary 2 (small)"
          onclick="findValidWords(2)"
        />
      </p>

      <hr />

      <span>Valid Words<span id="validWordsLabel"></span>:</span>
      <p id="validWordsTable"></p>
    </form>

    <script type="module">
      /*
       * Adaptive Spelling Bee scanner.
       *
       * 1. Detect the gold centre hexagon by colour.
       * 2. Estimate tile size from the detected gold region.
       * 3. Locate the six surrounding tiles.
       * 4. OCR each tile using three sequential crop passes.
       * 5. Queue all OCR predictions to prevent concurrent ONNX session runs.
       */

      let paddleOCR = null;
      let paddleOCRLoading = null;

      // Serialise every prediction using the shared OCR instance.
      let ocrPredictionQueue = Promise.resolve();

      function queuedOCRPredict(ocr, canvas, options) {
        const task = ocrPredictionQueue.then(() =>
          ocr.predict(canvas, options),
        );

        // A failed prediction must not permanently block the queue.
        ocrPredictionQueue = task.then(
          () => undefined,
          () => undefined,
        );

        return task;
      }

      const cameraInput = document.getElementById("cameraInput");
      const photoPreview = document.getElementById("photoPreview");
      const scanStatus = document.getElementById("scanStatus");

      const TILE_NAMES = [
        "center",
        "top",
        "upperLeft",
        "upperRight",
        "lowerLeft",
        "lowerRight",
        "bottom",
      ];

      const TILE_OFFSETS = {
        center: { x: 0.0, y: 0.0 },
        top: { x: 0.0, y: -1.02 },
        upperLeft: { x: -0.88, y: -0.51 },
        upperRight: { x: 0.88, y: -0.51 },
        lowerLeft: { x: -0.88, y: 0.51 },
        lowerRight: { x: 0.88, y: 0.51 },
        bottom: { x: 0.0, y: 1.02 },
      };

      async function getPaddleOCR() {
        if (paddleOCR) return paddleOCR;

        if (!paddleOCRLoading) {
          paddleOCRLoading = (async () => {
            scanStatus.textContent = "Loading PaddleOCR.js and its models...";

            const { PaddleOCR } =
              await import("https://esm.sh/@paddleocr/paddleocr-js@0.4.2?bundle");

            const modelBase =
              "https://huggingface.co/LunarOilRig/paddleocr-onnx/resolve/main";

            const instance = await PaddleOCR.create({
              lang: "en",
              textDetectionModelName: "PP-OCRv5_mobile_det",
              textDetectionModelAsset: {
                url: `${modelBase}/PP-OCRv5_mobile_det_onnx_infer.tar`,
              },
              textRecognitionModelName: "PP-OCRv5_mobile_rec",
              textRecognitionModelAsset: {
                url: `${modelBase}/PP-OCRv5_mobile_rec_onnx_infer.tar`,
              },
              ortOptions: {
                backend: "wasm",
                wasmPaths: "https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/",
              },
            });

            paddleOCR = instance;
            scanStatus.textContent = "OCR ready.";
            return instance;
          })();
        }

        try {
          return await paddleOCRLoading;
        } catch (error) {
          paddleOCRLoading = null;
          console.error("PaddleOCR initialisation failed:", error);
          scanStatus.textContent =
            "Could not load OCR models: " + error.message;
          throw error;
        }
      }

      function findGoldHexagon(image) {
        const maxSide = 1400;
        const scale = Math.min(
          1,
          maxSide / Math.max(image.naturalWidth, image.naturalHeight),
        );

        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));

        const ctx = canvas.getContext("2d", {
          willReadFrequently: true,
        });

        ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

        const width = canvas.width;
        const height = canvas.height;
        const pixels = ctx.getImageData(0, 0, width, height).data;
        const total = width * height;

        const mask = new Uint8Array(total);
        const visited = new Uint8Array(total);

        for (let p = 0, i = 0; p < total; p++, i += 4) {
          const r = pixels[i];
          const g = pixels[i + 1];
          const b = pixels[i + 2];

          if (
            r > 145 &&
            g > 90 &&
            b > 35 &&
            b < 215 &&
            r >= g - 5 &&
            g - b > 15 &&
            r - b > 25
          ) {
            mask[p] = 1;
          }
        }

        const stack = new Int32Array(total);
        const minimumArea = Math.max(25, total * 0.00015);

        let best = null;
        let bestScore = -Infinity;

        for (let start = 0; start < total; start++) {
          if (!mask[start] || visited[start]) continue;

          let stackSize = 0;
          stack[stackSize++] = start;
          visited[start] = 1;

          let area = 0;
          let minX = width;
          let minY = height;
          let maxX = 0;
          let maxY = 0;

          while (stackSize > 0) {
            const p = stack[--stackSize];
            const x = p % width;
            const y = Math.floor(p / width);

            area++;
            minX = Math.min(minX, x);
            minY = Math.min(minY, y);
            maxX = Math.max(maxX, x);
            maxY = Math.max(maxY, y);

            const neighbours = [p - 1, p + 1, p - width, p + width];

            for (let n = 0; n < neighbours.length; n++) {
              const q = neighbours[n];

              if (q < 0 || q >= total) continue;
              if (n === 0 && x === 0) continue;
              if (n === 1 && x === width - 1) continue;

              if (mask[q] && !visited[q]) {
                visited[q] = 1;
                stack[stackSize++] = q;
              }
            }
          }

          const boxWidth = maxX - minX + 1;
          const boxHeight = maxY - minY + 1;
          const aspect = boxWidth / boxHeight;

          if (
            area < minimumArea ||
            boxWidth < Math.max(8, width * 0.006) ||
            boxHeight < Math.max(8, height * 0.006) ||
            boxWidth > width * 0.35 ||
            boxHeight > height * 0.35 ||
            aspect < 0.7 ||
            aspect > 1.45
          ) {
            continue;
          }

          const score = area / (1 + Math.abs(Math.log(aspect)) * 2);

          if (score > bestScore) {
            bestScore = score;
            best = {
              x: minX,
              y: minY,
              width: boxWidth,
              height: boxHeight,
            };
          }
        }

        if (!best) {
          throw new Error(
            "Could not find the gold centre hexagon. " +
              "Please use a clear image showing the entire puzzle.",
          );
        }

        return {
          x: best.x / scale,
          y: best.y / scale,
          width: best.width / scale,
          height: best.height / scale,
        };
      }

      function estimateTileGeometry(image) {
        const gold = findGoldHexagon(image);

        return {
          centerX: gold.x + gold.width / 2,
          centerY: gold.y + gold.height / 2,
          tileWidth: gold.width / 0.86,
          tileHeight: gold.height / 0.86,
        };
      }

      function getTileRectangles(image) {
        const geometry = estimateTileGeometry(image);
        const rectangles = {};

        for (const name of TILE_NAMES) {
          const offset = TILE_OFFSETS[name];
          const cx = geometry.centerX + offset.x * geometry.tileWidth;
          const cy = geometry.centerY + offset.y * geometry.tileHeight;

          const cropWidth = geometry.tileWidth * 0.78;
          const cropHeight = geometry.tileHeight * 0.78;
          const x = cx - cropWidth / 2;
          const y = cy - cropHeight / 2;

          if (
            x < 0 ||
            y < 0 ||
            x + cropWidth > image.naturalWidth ||
            y + cropHeight > image.naturalHeight
          ) {
            throw new Error(
              `The estimated ${name} tile falls outside the image. ` +
                "Make sure the whole puzzle is visible.",
            );
          }

          rectangles[name] = {
            x,
            y,
            width: cropWidth,
            height: cropHeight,
          };
        }

        return rectangles;
      }

      function makeEnhancedTileCanvas(image, rect) {
        const enlargement = 4;
        const canvas = document.createElement("canvas");

        canvas.width = Math.max(1, Math.round(rect.width * enlargement));
        canvas.height = Math.max(1, Math.round(rect.height * enlargement));

        const ctx = canvas.getContext("2d", {
          willReadFrequently: true,
        });

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";

        ctx.drawImage(
          image,
          rect.x,
          rect.y,
          rect.width,
          rect.height,
          0,
          0,
          canvas.width,
          canvas.height,
        );

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

        const pixels = imageData.data;

        for (let i = 0; i < pixels.length; i += 4) {
          const brightness =
            0.299 * pixels[i] + 0.587 * pixels[i + 1] + 0.114 * pixels[i + 2];

          const enhanced = Math.max(
            0,
            Math.min(255, (brightness - 128) * 1.35 + 128),
          );

          pixels[i] = enhanced;
          pixels[i + 1] = enhanced;
          pixels[i + 2] = enhanced;
          pixels[i + 3] = 255;
        }

        ctx.putImageData(imageData, 0, 0);
        return canvas;
      }

      function makeCropCanvas(image, crop) {
        const canvas = document.createElement("canvas");
        canvas.width = 480;
        canvas.height = 480;

        const ctx = canvas.getContext("2d", {
          willReadFrequently: true,
        });

        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, 480, 480);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";

        const scale = Math.min(400 / crop.width, 400 / crop.height);

        const width = crop.width * scale;
        const height = crop.height * scale;

        ctx.drawImage(
          image,
          crop.x,
          crop.y,
          crop.width,
          crop.height,
          (480 - width) / 2,
          (480 - height) / 2,
          width,
          height,
        );

        return canvas;
      }

      async function recogniseTile(ocr, image, rect) {
        function normaliseLetter(text) {
          const raw = (text || "").trim().toUpperCase();

          if (raw === "1") return "I";
          if (raw === "0") return "O";

          const letters = raw.replace(/[^A-Z]/g, "");
          return letters.length === 1 ? letters : "";
        }

        async function runPass(canvas) {
          // Important: all predictions use the serial queue.
          const [result] = await queuedOCRPredict(ocr, canvas, {
            textRecScoreThresh: 0.05,
          });

          return (result.items || [])
            .map((item) => ({
              letter: normaliseLetter(item.text),
              score: Number(item.score) || 0,
            }))
            .filter((item) => item.letter)
            .sort((a, b) => b.score - a.score);
        }

        // Pass 1: original enhanced crop.
        const first = await runPass(makeEnhancedTileCanvas(image, rect));

        // Pass 2: tighter crop.
        const insetX = rect.width * 0.1;
        const insetY = rect.height * 0.1;

        const tightX = Math.max(0, rect.x + insetX);
        const tightY = Math.max(0, rect.y + insetY);

        const tightRect = {
          x: tightX,
          y: tightY,
          width: Math.min(rect.width - insetX * 2, image.naturalWidth - tightX),
          height: Math.min(
            rect.height - insetY * 2,
            image.naturalHeight - tightY,
          ),
        };

        const tight = await runPass(makeCropCanvas(image, tightRect));

        // Pass 3: slightly wider crop.
        const padX = rect.width * 0.08;
        const padY = rect.height * 0.08;
        const wideX = Math.max(0, rect.x - padX);
        const wideY = Math.max(0, rect.y - padY);

        const wideRect = {
          x: wideX,
          y: wideY,
          width: Math.min(rect.width + padX * 2, image.naturalWidth - wideX),
          height: Math.min(rect.height + padY * 2, image.naturalHeight - wideY),
        };

        const wide = await runPass(makeCropCanvas(image, wideRect));

        const all = [...first, ...tight, ...wide];

        if (!all.length) {
          return { letter: "", score: 0 };
        }

        // Each crop contributes at most one vote per candidate letter.
        const votes = {};

        for (const passResults of [first, tight, wide]) {
          const passLetters = new Set(passResults.map((item) => item.letter));

          for (const letter of passLetters) {
            const item = passResults.find(
              (candidate) => candidate.letter === letter,
            );

            if (!votes[letter]) {
              votes[letter] = {
                count: 0,
                totalScore: 0,
                bestScore: 0,
              };
            }

            votes[letter].count++;
            votes[letter].totalScore += item.score;
            votes[letter].bestScore = Math.max(
              votes[letter].bestScore,
              item.score,
            );
          }
        }

        const [letter, stats] = Object.entries(votes).sort(
          (a, b) =>
            b[1].count - a[1].count ||
            b[1].totalScore - a[1].totalScore ||
            b[1].bestScore - a[1].bestScore,
        )[0];

        return {
          letter,
          score: stats.bestScore,
        };
      }

      async function scanPhoto(file) {
        if (!file) return;

        if (!file.type.startsWith("image/")) {
          scanStatus.textContent = "Please choose an image.";
          return;
        }

        const objectUrl = URL.createObjectURL(file);

        try {
          photoPreview.src = objectUrl;
          photoPreview.style.display = "block";

          await photoPreview.decode();

          scanStatus.textContent = "Finding the gold centre hexagon...";

          const rectangles = getTileRectangles(photoPreview);
          const ocr = await getPaddleOCR();
          const recognisedTiles = {};

          // Deliberately process tiles one by one.
          for (let i = 0; i < TILE_NAMES.length; i++) {
            const name = TILE_NAMES[i];

            scanStatus.textContent = `Scanning ${name} tile (${i + 1} of 7)...`;

            try {
              recognisedTiles[name] = await recogniseTile(
                ocr,
                photoPreview,
                rectangles[name],
              );
            } catch (error) {
              console.warn(`OCR failed for ${name}:`, error);
              recognisedTiles[name] = {
                letter: "",
                score: 0,
              };
            }
          }

          document.mainForm.centerLetter.value = recognisedTiles.center.letter;

          const outerOrder = [
            "top",
            "upperLeft",
            "upperRight",
            "lowerLeft",
            "lowerRight",
            "bottom",
          ];

          document.mainForm.otherLetters.value = outerOrder
            .map((name) => recognisedTiles[name].letter)
            .join("");

          const lines = TILE_NAMES.map((name) => {
            const result = recognisedTiles[name];
            const label = name === "center" ? "Centre (gold)" : name;

            const confidence =
              result.letter && result.score
                ? ` (${Math.round(result.score * 100)}% confidence)`
                : "";

            return `${label}: ${result.letter || "not recognised"}${confidence}`;
          });

          const missing = TILE_NAMES.filter(
            (name) => !recognisedTiles[name].letter,
          );

          if (missing.length === 0) {
            scanStatus.textContent =
              "Scanned all seven tile regions:\n" +
              lines.join("\n") +
              "\n\nPlease check the letters before searching.";
          } else {
            scanStatus.textContent =
              `Recognised ${7 - missing.length} of 7 tile letters:\n` +
              lines.join("\n") +
              "\n\nCorrect any missing or incorrect letters manually.";
          }
        } catch (error) {
          console.error("Spelling Bee scan failed:", error);

          scanStatus.textContent =
            "Scan failed: " +
            (error.message || error) +
            "\n\nTry an image showing the complete puzzle clearly.";
        } finally {
          URL.revokeObjectURL(objectUrl);
        }
      }

      cameraInput.addEventListener("change", async () => {
        const file = cameraInput.files && cameraInput.files[0];

        if (file) {
          await scanPhoto(file);
        }

        cameraInput.value = "";
      });

      /*
       * Preserve dictionary search.
       */
      window.findValidWords = async function (dictionaryIndex) {
        const centerLetter = document.mainForm.centerLetter.value
          .trim()
          .toLowerCase();

        const otherLetters = document.mainForm.otherLetters.value
          .trim()
          .toLowerCase()
          .replace(/[^a-z]/g, "");

        const allLetters = centerLetter + otherLetters;
        const minLength = parseInt(document.mainForm.minLength.value, 10);

        if (!/^[a-z]$/.test(centerLetter) || otherLetters.length !== 6) {
          alert("Please enter one centre letter and six other letters.");
          return;
        }

        try {
          const [selectedDictionary, extraDictionary] = await Promise.all([
            loadDictionaryFile(`dictionary${dictionaryIndex}.txt`),
            loadDictionaryFile("dictionaryExtra.txt"),
          ]);

          const uniqueWords = [
            ...new Set(
              (selectedDictionary + "\n" + extraDictionary)
                .split(/\r?\n/)
                .map((word) => word.toLowerCase().trim())
                .filter(Boolean),
            ),
          ];

          const validWords = uniqueWords
            .filter(
              (word) =>
                word.length >= minLength &&
                word.includes(centerLetter) &&
                [...word].every((letter) => allLetters.includes(letter)),
            )
            .sort();

          let tableHtml = "<table>";

          for (const word of validWords) {
            const isPangram = [...new Set(allLetters)].every((letter) =>
              word.includes(letter),
            );

            tableHtml += `<tr><td>${
              isPangram ? "<b>" + word + "</b>" : word
            }</td></tr>`;
          }

          tableHtml += "</table>";

          document.getElementById("validWordsLabel").textContent =
            " (" + validWords.length + ")";

          document.getElementById("validWordsTable").innerHTML = tableHtml;
        } catch (error) {
          console.error(error);
          alert(
            "Could not load the dictionary files. " +
              "Check the filenames and server.",
          );
        }
      };

      async function loadDictionaryFile(filename) {
        const response = await fetch(filename);

        if (!response.ok) {
          throw new Error(
            `Failed to load ${filename}: HTTP ${response.status}`,
          );
        }

        return await response.text();
      }
    </script>
  </body>
</html>
