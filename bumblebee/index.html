<!DOCTYPE html>
<html>
<head>
    <title>Tort and Joie - Bumblebee</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" type="image/png" href="/assets/images/bumblebee.png">
</head>
<body style="background-color: lightyellow">
	<p>
		<img src="/assets/images/bumblebee.png" height="32" width="32" />
	</p>
	<form name="mainForm">
		<p>
			<span>Center letter:</span>
			<input type="text" name="centerLetter" maxlength="1" style="height: 35px; width: 35px; font-size: 24px; text-align: center; text-transform: uppercase;" />
		</p>
		<p>
			<span>Other letters:</span>
			<input type="text" name="otherLetters" maxlength="6" style="height: 35px; width: 150px; font-size: 24px; text-transform: uppercase;" />
		</p>
		<p>
			<span>Minimum length:</span>
			<input type="number" name="minLength" value="4" style="width: 35px" />
		</p>
		<p>
			<input onclick="javascript:findValidWords(1);" type="button" value="Search Dictionary 1" />
		</p>
		<p>
			<input onclick="javascript:findValidWords(2);" type="button" value="Search Dictionary 2" />
		</p>
		<hr />
		<span>Valid Words<span id="validWordsLabel"></span>:</span>
		<p id="validWordsTable">
		</p>
	</form>
</body>
<script>
	async function findValidWords(dictionaryIndex) {

		const centerLetter = document.mainForm.centerLetter.value.toLowerCase();
		const otherLetters = document.mainForm.otherLetters.value.toLowerCase();
		const allLetters = centerLetter.concat(otherLetters);
		const minLength = parseInt(document.mainForm.minLength.value);

		const selectedDictionary = await loadSelectedDictionaryFile(dictionaryIndex);
		const extraDictionary = await loadExtraDictionaryFile(); // contains words from NYT Spelling Bee that are not in our dictionaries
		const allDictionaryLines = `${selectedDictionary}\n${extraDictionary}`;
		const uniqueDictionaryWords = [...new Set(allDictionaryLines.split('\n').map(word => word.toLowerCase().trim()))]
			.filter(word => word.length > 0);
		const validWords = uniqueDictionaryWords
			.filter(word => word.length >= minLength 
						&& word.includes(centerLetter)
						&& word.split('').every(letter => allLetters.includes(letter)))
			.sort();

		let tableHtml = '<table>';
		validWords.forEach(word => {
			const isPangram = allLetters.split('').every(letter => word.includes(letter));
			tableHtml += `<tr><td>${isPangram ? `<b>${word}</b>` : word}</td></tr>`;
		});
		tableHtml += '</table>';

		document.getElementById('validWordsLabel').innerHTML = " (" + validWords.length + ")";
		document.getElementById('validWordsTable').innerHTML = tableHtml;
	}

	const loadSelectedDictionaryFile = async (dictionaryIndex) => {
		const response = await fetch(`dictionary${dictionaryIndex}.txt`).catch(err => console.error(err));
		return await response.text();
	}

	const loadExtraDictionaryFile = async () => {
		const response = await fetch('dictionaryExtra.txt').catch(err => console.error(err));
		return await response.text();
	}
</script>
</html>
