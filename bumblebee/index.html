<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f5ef" />
    <title>Tort and Joie - Bumblebee</title>
    <meta
      name="description"
      content="Upload a photo of your Spelling Bee puzzle to identify its seven letters."
    />
    <link
      rel="shortcut icon"
      type="image/png"
      href="/assets/images/bumblebee.png"
    />

    <style>
      :root {
        --background: lightyellow;
        --card: #ffffff;
        --text: #25251f;
        --muted: #66665f;
        --border: #deded5;
        --green: #276749;
        --red: #a12b2b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px 14px 40px;
        background: var(--background);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        line-height: 1.5;
      }

      main {
        width: 100%;
        max-width: 650px;
        margin: 0 auto;
      }

      .brand {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.8rem, 6vw, 2.5rem);
        line-height: 1.15;
      }

      .intro {
        margin: 0 0 24px;
        color: var(--muted);
      }

      .panel {
        padding: clamp(18px, 5vw, 28px);
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--card);
        box-shadow: 0 8px 28px rgb(25 25 15 / 5%);
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 700;
      }

      input[type="file"],
      input[type="text"],
      input[type="number"] {
        display: block;
        width: 100%;
        min-height: 46px;
        padding: 10px 12px;
        border: 1px solid #c9cabe;
        border-radius: 10px;
        background: #fff;
        color: var(--text);
        font: inherit;
      }

      input[type="file"] {
        padding: 8px;
      }

      .hint {
        color: var(--muted);
        font-size: 0.88rem;
      }

      .hint {
        margin: 8px 0 16px;
      }

      /* Uploaded image preview */
      .preview-box {
        display: none;
        margin: 16px 0 20px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #fafaf7;
      }

      .preview-box.visible {
        display: block;
      }

      .preview-heading {
        margin: 0 0 10px;
        font-size: 0.92rem;
        font-weight: 700;
      }

      #imagePreview {
        display: block;
        width: 100%;
        max-height: 380px;
        object-fit: contain;
        border-radius: 8px;
        background: #efefea;
      }

      #imageDetails {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 0.8rem;
        overflow-wrap: anywhere;
      }

      .turnstile-wrap {
        min-height: 65px;
        margin-top: 16px;
      }

      button {
        width: 100%;
        min-height: 48px;
        margin-top: 16px;
        padding: 12px 18px;
        border: 0;
        border-radius: 10px;
        background: var(--text);
        color: #fff;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .status {
        display: none;
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 10px;
        overflow-wrap: anywhere;
      }

      .status.visible {
        display: block;
      }
      .status.error {
        background: #fff0ef;
        color: var(--red);
      }
      .status.success {
        background: #edf8f0;
        color: var(--green);
      }
      .status.info {
        background: #f0f0eb;
        color: var(--text);
      }

      .results {
        margin-top: 28px;
        padding-top: 24px;
        border-top: 1px solid var(--border);
      }

      .results h2 {
        margin: 0 0 16px;
        font-size: 1.2rem;
      }

      .field {
        margin-bottom: 16px;
      }

      .field input {
        font-size: 1.1rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      footer {
        margin-top: 22px;
        color: var(--muted);
        font-size: 0.85rem;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <main>
      <!--
        <p>
          <img
            src="/assets/images/bumblebee.png"
            height="32"
            width="32"
            alt="Bumblebee"
          />
        </p>
        <p class="intro">
          Take a photo of your puzzle or choose one from your photo library. Check
          the preview, then identify the seven letters.
        </p>
      -->

      <section class="panel">
        <label for="puzzleImage">Choose a photo</label>
        <input id="puzzleImage" type="file" accept="image/*" />

        <p class="hint">
          On a phone, you can take a new photo or select an existing image.
        </p>

        <!-- The preview appears as soon as an image is selected. -->
        <div id="previewBox" class="preview-box" aria-live="polite">
          <p class="preview-heading">Photo preview</p>
          <img id="imagePreview" alt="Preview of your selected puzzle photo" />
          <p id="imageDetails"></p>
        </div>

        <div class="turnstile-wrap">
          <div id="turnstileWidget"></div>
        </div>

        <button id="identifyButton" type="button" disabled>
          Identify letters
        </button>

        <div id="status" class="status" role="status" aria-live="polite"></div>

        <form name="mainForm">
          <div class="results">
            <h2>Identified letters</h2>

            <div class="field">
              <label for="centerLetter">Center letter</label>
              <input
                id="centerLetter"
                name="centerLetter"
                type="text"
                maxlength="1"
                autocomplete="off"
                autocapitalize="characters"
                placeholder="e.g. A"
              />
            </div>

            <div class="field">
              <label for="otherLetters">Other letters</label>
              <input
                id="otherLetters"
                name="otherLetters"
                type="text"
                autocomplete="off"
                autocapitalize="characters"
                placeholder="e.g. B C D E F G"
              />
            </div>

            <div class="minLength">
              <label for="minLength">Minimum length</label>
              <input
                id="minLength"
                name="minLength"
                type="number"
                autocomplete="off"
                value="4"
                style="width: 100px"
              />
            </div>

            <p class="hint">
              Please check the letter. You can edit the letters in either field.
            </p>

            <button
              id="searchDictionary1BigButton"
              type="button"
              onclick="findValidWords(1)"
            >
              Search Dictionary 1 (big)
            </button>

            <button
              id="searchDictionary2SmallButton"
              type="button"
              onclick="findValidWords(2)"
            >
              Search Dictionary 2 (small)
            </button>

            <hr />

            <span>Valid Words<span id="validWordsLabel"></span>:</span>
            <div id="validWordsTable"></div>
          </div>
        </form>
      </section>
    </main>

    <script>
      (() => {
        "use strict";

        const API_URL = "https://spelling-bee-api.jpalexa.workers.dev/";
        const TURNSTILE_SITE_KEY = "0x4AAAAAAFgkT2gEOe-ettS3";
        const MAX_IMAGE_BYTES = 15 * 1024 * 1024;
        const MAX_DIMENSION = 1800;
        const MAX_VALIDATION_SIDE = 1200;

        // Gold centre: #F7DA21.
        const TARGET_GOLD_RGB = { r: 247, g: 218, b: 33 };
        const GOLD_COLOR_DISTANCE_TOLERANCE = 65;

        // Centre-hexagon shape requirements.
        const MIN_HEXAGON_VERTICES = 5;
        const MAX_HEXAGON_VERTICES = 7;
        const MIN_HEXAGON_ASPECT = 0.75;
        const MAX_HEXAGON_ASPECT = 1.35;
        const MIN_HEXAGON_FILL = 0.45;
        const MAX_HEXAGON_FILL = 0.95;

        // Grey ring: thickness is approximately one centre-hexagon size.
        const RING_INNER_RADIUS_FACTOR = 0.55;

        const fileInput = document.getElementById("puzzleImage");
        const previewBox = document.getElementById("previewBox");
        const preview = document.getElementById("imagePreview");
        const imageDetails = document.getElementById("imageDetails");
        const button = document.getElementById("identifyButton");
        const statusBox = document.getElementById("status");
        const centerField = document.getElementById("centerLetter");
        const otherField = document.getElementById("otherLetters");

        let selectedFile = null;
        let previewUrl = null;
        let turnstileWidgetId = null;
        let turnstileToken = "";
        let imageValidationPassed = false;
        let cvPromise = null;
        let persistentError = false;
        let turnstileLoadStarted = false;

        // ------------------------------------------------------------
        // Status and button state
        // ------------------------------------------------------------

        function showStatus(message, type = "info", { force = false } = {}) {
          if (persistentError && !force) return;

          statusBox.textContent = message;
          statusBox.className = `status visible ${type}`;
        }

        function showPersistentError(message) {
          persistentError = true;
          statusBox.textContent = message;
          statusBox.className = "status visible error";
        }

        function clearStatus({ force = false } = {}) {
          if (persistentError && !force) return;

          statusBox.textContent = "";
          statusBox.className = "status";
        }

        function clearPersistentError() {
          persistentError = false;
          clearStatus({ force: true });
        }

        function updateButton() {
          button.disabled =
            !selectedFile ||
            !imageValidationPassed ||
            !turnstileToken ||
            button.dataset.busy === "true";
        }

        // ------------------------------------------------------------
        // Cloudflare Turnstile
        // ------------------------------------------------------------

        function initializeTurnstile() {
          if (turnstileWidgetId !== null) return;

          if (!window.turnstile) {
            showPersistentError(
              "The security check loaded incorrectly. Please refresh the page and try again.",
            );
            return;
          }

          try {
            turnstileWidgetId = window.turnstile.render("#turnstileWidget", {
              sitekey: TURNSTILE_SITE_KEY,
              theme: "light",

              callback(token) {
                turnstileToken = token;
                updateButton();
              },

              "expired-callback"() {
                turnstileToken = "";
                updateButton();
              },

              "error-callback"() {
                turnstileToken = "";
                updateButton();
                showStatus(
                  "The security check could not be completed. Please try again.",
                  "error",
                );
              },
            });
          } catch {
            turnstileWidgetId = null;
            turnstileToken = "";
            updateButton();

            showPersistentError(
              "The security check could not be initialized. Please refresh the page and try again.",
            );
          }
        }

        function loadTurnstile() {
          if (turnstileLoadStarted) return;
          turnstileLoadStarted = true;

          const script = document.createElement("script");
          script.src =
            "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
          script.async = true;
          script.onload = initializeTurnstile;

          script.onerror = () => {
            turnstileToken = "";
            updateButton();

            showPersistentError(
              "The security check could not load. Check your connection and refresh the page to try again.",
            );
          };

          document.head.appendChild(script);
        }

        // ------------------------------------------------------------
        // OpenCV.js loader
        // ------------------------------------------------------------

        function loadOpenCV() {
          if (cvPromise) return cvPromise;

          cvPromise = new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = "https://docs.opencv.org/5.x/opencv.js";
            script.async = true;

            let settled = false;
            let runtimeReadyResolve;

            const runtimeReady = new Promise((resolveRuntime) => {
              runtimeReadyResolve = resolveRuntime;
            });

            // IMPORTANT: Set this up before OpenCV's script is loaded.
            const moduleObject = (window.Module = window.Module || {});
            const previousRuntimeCallback = moduleObject.onRuntimeInitialized;

            moduleObject.onRuntimeInitialized = function () {
              try {
                if (typeof previousRuntimeCallback === "function") {
                  previousRuntimeCallback.apply(this, arguments);
                }
              } finally {
                runtimeReadyResolve();
              }
            };

            const timeout = window.setTimeout(() => {
              fail(
                new Error(
                  "OpenCV took too long to initialize. Please refresh and try again.",
                ),
              );
            }, 30000);

            function cleanup() {
              window.clearTimeout(timeout);
              script.onload = null;
              script.onerror = null;
            }

            function fail(error) {
              if (settled) return;

              settled = true;
              cleanup();
              reject(error);
            }

            function succeed(cvModule) {
              if (settled) return;

              if (!cvModule || typeof cvModule.Mat !== "function") {
                fail(
                  new Error(
                    "OpenCV's runtime initialized, but cv.Mat is unavailable.",
                  ),
                );
                return;
              }

              settled = true;
              cleanup();

              // Wrap cv to avoid Promise resolution assimilating a thenable module.
              resolve({ cv: cvModule });
            }

            script.onload = async () => {
              try {
                const loadedCv = window.cv;

                if (!loadedCv) {
                  throw new Error(
                    "The OpenCV script loaded without exposing cv.",
                  );
                }

                // Some builds expose cv as a genuine Promise.
                if (loadedCv instanceof Promise) {
                  const readyCv = await loadedCv;
                  succeed(readyCv);
                  return;
                }

                // Other builds expose cv before its runtime is initialized.
                if (typeof loadedCv.Mat === "function") {
                  succeed(loadedCv);
                  return;
                }

                // Wait for the callback registered before loading the script.
                await runtimeReady;

                if (settled) return;

                // Re-read cv after initialization; do not await a thenable module.
                succeed(window.cv);
              } catch (error) {
                fail(
                  error instanceof Error
                    ? error
                    : new Error("OpenCV could not be initialized."),
                );
              }
            };

            script.onerror = () => {
              fail(
                new Error(
                  "OpenCV could not be downloaded. Check your connection and try again.",
                ),
              );
            };

            document.head.appendChild(script);
          }).catch((error) => {
            cvPromise = null;
            throw error;
          });

          return cvPromise;
        }

        // ------------------------------------------------------------
        // OpenCV helpers
        // ------------------------------------------------------------

        function oddKernelSize(value) {
          const size = Math.max(1, Math.round(value));
          return size % 2 === 0 ? size + 1 : size;
        }

        function contourVertexCount(cv, contour, epsilonFraction = 0.025) {
          const perimeter = cv.arcLength(contour, true);
          const approximation = new cv.Mat();

          try {
            cv.approxPolyDP(
              contour,
              approximation,
              epsilonFraction * perimeter,
              true,
            );
            return approximation.rows;
          } finally {
            approximation.delete();
          }
        }

        function closeMask(cv, mask, kernelSize) {
          const kernel = cv.Mat.ones(kernelSize, kernelSize, cv.CV_8U);
          const output = new cv.Mat();

          try {
            cv.morphologyEx(mask, output, cv.MORPH_CLOSE, kernel);
            return output;
          } catch (error) {
            output.delete();
            throw error;
          } finally {
            kernel.delete();
          }
        }

        // ------------------------------------------------------------
        // Gold-centre colour mask and detection
        // ------------------------------------------------------------

        function createGoldColorMask(cv, rgb) {
          const mask = new cv.Mat(
            rgb.rows,
            rgb.cols,
            cv.CV_8UC1,
            new cv.Scalar(0),
          );

          const { r, g, b } = TARGET_GOLD_RGB;
          const maxDistanceSquared = GOLD_COLOR_DISTANCE_TOLERANCE ** 2;

          try {
            for (let y = 0; y < rgb.rows; y++) {
              const sourceRow = rgb.ucharPtr(y);
              const maskRow = mask.ucharPtr(y);

              for (let x = 0; x < rgb.cols; x++) {
                const offset = x * 3;
                const dr = sourceRow[offset] - r;
                const dg = sourceRow[offset + 1] - g;
                const db = sourceRow[offset + 2] - b;

                if (dr * dr + dg * dg + db * db <= maxDistanceSquared) {
                  maskRow[x] = 255;
                }
              }
            }

            return mask;
          } catch (error) {
            mask.delete();
            throw error;
          }
        }

        function findGoldCenter(cv, rgb, imageWidth, imageHeight) {
          const imageArea = imageWidth * imageHeight;
          const minArea = imageArea * 0.00018;
          const goldMask = createGoldColorMask(cv, rgb);

          let closed;

          try {
            const kernelSize = Math.max(
              3,
              oddKernelSize(Math.min(imageWidth, imageHeight) * 0.006),
            );
            closed = closeMask(cv, goldMask, kernelSize);
          } finally {
            goldMask.delete();
          }

          const contours = new cv.MatVector();
          const hierarchy = new cv.Mat();
          const candidates = [];

          try {
            cv.findContours(
              closed,
              contours,
              hierarchy,
              cv.RETR_EXTERNAL,
              cv.CHAIN_APPROX_SIMPLE,
            );

            for (let i = 0; i < contours.size(); i++) {
              const contour = contours.get(i);

              try {
                const area = cv.contourArea(contour);
                if (area < minArea) continue;

                const rect = cv.boundingRect(contour);
                if (rect.width < 8 || rect.height < 8) continue;

                const vertices = contourVertexCount(cv, contour);
                const aspect = rect.width / rect.height;
                const fillRatio = area / (rect.width * rect.height);

                if (
                  vertices < MIN_HEXAGON_VERTICES ||
                  vertices > MAX_HEXAGON_VERTICES ||
                  aspect < MIN_HEXAGON_ASPECT ||
                  aspect > MAX_HEXAGON_ASPECT ||
                  fillRatio < MIN_HEXAGON_FILL ||
                  fillRatio > MAX_HEXAGON_FILL
                ) {
                  continue;
                }

                const score =
                  Math.log1p(area / minArea) -
                  Math.abs(vertices - 6) * 0.35 -
                  Math.abs(Math.log(Math.max(aspect, 0.001) / 1.15)) -
                  Math.abs(fillRatio - 0.72) * 0.6;

                candidates.push({
                  x: rect.x + rect.width / 2,
                  y: rect.y + rect.height / 2,
                  width: rect.width,
                  height: rect.height,
                  area,
                  vertices,
                  aspect,
                  fillRatio,
                  score,
                });
              } finally {
                contour.delete();
              }
            }
          } finally {
            contours.delete();
            hierarchy.delete();
            closed.delete();
          }

          if (!candidates.length) {
            throw new Error(
              "Invalid image (center)",
              // "I couldn't find a gold center matching #F7DA21 with a roughly hexagonal shape. Please use a clear screenshot showing the gold tile.",
            );
          }

          candidates.sort((a, b) => {
            const areaDifference = b.area - a.area;

            return Math.abs(areaDifference) > imageArea * 0.0002
              ? areaDifference
              : b.score - a.score;
          });

          return candidates[0];
        }

        // ------------------------------------------------------------
        // Surrounding grey-ring check
        // ------------------------------------------------------------

        function hasSurroundingColorRing(cv, hsv, center) {
          const hexSize = (center.width + center.height) / 2;
          const innerRadius = hexSize * RING_INNER_RADIUS_FACTOR;
          const outerRadius = innerRadius + hexSize;
          const cx = center.x + center.width / 2;
          const cy = center.y + center.height / 2;

          const directions = 24;
          const radialSteps = 9;

          let totalSamples = 0;
          let greySamples = 0;
          let darkSamples = 0;

          for (let d = 0; d < directions; d++) {
            const angle = (2 * Math.PI * d) / directions;

            for (let r = 0; r < radialSteps; r++) {
              const radius =
                innerRadius +
                (r / (radialSteps - 1)) * (outerRadius - innerRadius);

              const x = Math.round(cx + Math.cos(angle) * radius);
              const y = Math.round(cy + Math.sin(angle) * radius);

              if (x < 0 || y < 0 || x >= hsv.cols || y >= hsv.rows) {
                continue;
              }

              const pixel = hsv.ucharPtr(y, x);
              const saturation = pixel[1];
              const value = pixel[2];

              totalSamples++;

              if (value <= 85) darkSamples++;
              if (saturation <= 55) greySamples++;
            }
          }

          if (!totalSamples) return false;

          return (
            greySamples / totalSamples >= 0.65 &&
            darkSamples / totalSamples <= 0.55
          );
        }

        // ------------------------------------------------------------
        // Local image validation
        // ------------------------------------------------------------

        async function validatePuzzleImage(file) {
          if (!file || !file.type.startsWith("image/")) {
            throw new Error("Please choose an image file.");
          }

          if (file.size > MAX_IMAGE_BYTES) {
            throw new Error(
              "That photo is larger than 15 MB. Please choose a smaller image.",
            );
          }

          let bitmap;

          try {
            bitmap = await createImageBitmap(file);
          } catch {
            throw new Error(
              "This photo could not be opened by your browser. Try a JPEG or PNG image.",
            );
          }

          try {
            const originalWidth = bitmap.width;
            const originalHeight = bitmap.height;

            if (originalWidth < 250 || originalHeight < 250) {
              throw new Error(
                "This image is too small to check reliably. Please choose a larger photo.",
              );
            }

            if (originalWidth * originalHeight > 60000000) {
              throw new Error(
                "This photo has an unusually high resolution. Please choose a smaller image.",
              );
            }

            const scale = Math.min(
              1,
              MAX_VALIDATION_SIDE / Math.max(originalWidth, originalHeight),
            );

            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(originalWidth * scale));
            canvas.height = Math.max(1, Math.round(originalHeight * scale));

            const context = canvas.getContext("2d", {
              willReadFrequently: true,
            });

            if (!context) {
              throw new Error("Your browser could not inspect this image.");
            }

            context.fillStyle = "#ffffff";
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);

            bitmap.close();
            bitmap = null;

            const { cv } = await loadOpenCV();
            const requiredFunctions = [
              "Mat",
              "imread",
              "cvtColor",
              "findContours",
              "morphologyEx",
              "arcLength",
              "approxPolyDP",
              "boundingRect",
              "contourArea",
            ];

            if (
              requiredFunctions.some((name) => typeof cv[name] !== "function")
            ) {
              throw new Error(
                "OpenCV loaded, but some image-processing functions are unavailable.",
              );
            }

            const src = cv.imread(canvas);
            const rgb = new cv.Mat();
            const hsv = new cv.Mat();

            try {
              cv.cvtColor(src, rgb, cv.COLOR_RGBA2RGB);
              cv.cvtColor(rgb, hsv, cv.COLOR_RGB2HSV);

              const center = findGoldCenter(
                cv,
                rgb,
                canvas.width,
                canvas.height,
              );

              if (!hasSurroundingColorRing(cv, hsv, center)) {
                throw new Error(
                  "Invalid image (ring)",
                  // "I found a gold, hexagon-like center, but not enough contrasting color around it. Please use a clearer screenshot showing the center and nearby tiles.",
                );
              }

              return true;
            } finally {
              src.delete();
              rgb.delete();
              hsv.delete();
            }
          } finally {
            if (bitmap && typeof bitmap.close === "function") {
              bitmap.close();
            }
          }
        }

        // ------------------------------------------------------------
        // Image selection and preview
        // ------------------------------------------------------------

        function releasePreviewUrl() {
          if (!previewUrl) return;

          URL.revokeObjectURL(previewUrl);
          previewUrl = null;
        }

        loadTurnstile();

        fileInput.addEventListener("change", () => {
          clearPersistentError();

          const file = fileInput.files?.[0] || null;

          selectedFile = file;
          imageValidationPassed = false;
          turnstileToken = "";

          if (window.turnstile && turnstileWidgetId !== null) {
            window.turnstile.reset(turnstileWidgetId);
          }

          releasePreviewUrl();

          if (!file) {
            previewBox.classList.remove("visible");
            preview.removeAttribute("src");
            imageDetails.textContent = "";
            updateButton();
            return;
          }

          if (!file.type.startsWith("image/")) {
            selectedFile = null;
            previewBox.classList.remove("visible");
            showPersistentError("Please choose an image file.");
            updateButton();
            return;
          }

          const currentPreviewUrl = URL.createObjectURL(file);
          previewUrl = currentPreviewUrl;

          preview.onload = async () => {
            if (selectedFile !== file) return;

            imageDetails.textContent = `${file.name} · ${(file.size / (1024 * 1024)).toFixed(2)} MB`;

            showStatus("Checking image quality on your device...", "info");

            try {
              await validatePuzzleImage(file);

              if (selectedFile !== file) return;

              imageValidationPassed = true;

              showStatus(
                "The image looks valid. Complete the security check to identify the letters.",
                "success",
              );
            } catch (error) {
              if (selectedFile !== file) return;

              selectedFile = null;
              imageValidationPassed = false;
              fileInput.value = "";

              showPersistentError(
                error?.message ||
                  "Could not verify the image. Please choose another photo.",
              );
            } finally {
              updateButton();
            }
          };

          preview.onerror = () => {
            if (selectedFile !== file) return;

            selectedFile = null;
            imageValidationPassed = false;

            releasePreviewUrl();
            preview.removeAttribute("src");
            previewBox.classList.remove("visible");
            imageDetails.textContent = "";

            showPersistentError(
              "Could not preview this image. Try a JPEG or PNG photo.",
            );

            updateButton();
          };

          preview.src = currentPreviewUrl;
          previewBox.classList.add("visible");

          showStatus(
            "Your photo is ready to preview. Validating image...",
            "info",
          );

          updateButton();
        });

        // ------------------------------------------------------------
        // Prepare image for API upload
        // ------------------------------------------------------------

        async function prepareImage(file) {
          let bitmap;

          try {
            if ("createImageBitmap" in window) {
              bitmap = await createImageBitmap(file);
            } else {
              bitmap = await new Promise((resolve, reject) => {
                const image = new Image();
                const url = URL.createObjectURL(file);

                image.onload = () => {
                  URL.revokeObjectURL(url);
                  resolve(image);
                };

                image.onerror = () => {
                  URL.revokeObjectURL(url);
                  reject(new Error("Unsupported image format."));
                };

                image.src = url;
              });
            }
          } catch {
            throw new Error(
              "This browser could not read the photo format. On iPhone, try a JPEG photo or set Settings → Camera → Formats to Most Compatible.",
            );
          }

          try {
            const width = bitmap.width || bitmap.naturalWidth;
            const height = bitmap.height || bitmap.naturalHeight;

            if (!width || !height) {
              throw new Error(
                "The image could not be read. Please choose another photo.",
              );
            }

            const scale = Math.min(1, MAX_DIMENSION / Math.max(width, height));

            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(width * scale));
            canvas.height = Math.max(1, Math.round(height * scale));

            const context = canvas.getContext("2d", { alpha: false });

            if (!context) {
              throw new Error("Your browser could not prepare the image.");
            }

            context.fillStyle = "#ffffff";
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);

            let dataUrl = canvas.toDataURL("image/jpeg", 0.88);

            if (dataUrl.length * 0.75 > MAX_IMAGE_BYTES) {
              dataUrl = canvas.toDataURL("image/jpeg", 0.7);
            }

            const base64 = dataUrl.split(",")[1] || "";

            if (Math.floor(base64.length * 0.75) > MAX_IMAGE_BYTES) {
              throw new Error(
                "The image is still too large after resizing. Please choose a smaller photo.",
              );
            }

            return dataUrl;
          } finally {
            if (bitmap && typeof bitmap.close === "function") {
              bitmap.close();
            }
          }
        }

        // ------------------------------------------------------------
        // Identify letters through the API
        // ------------------------------------------------------------

        button.addEventListener("click", async () => {
          if (!selectedFile) {
            showStatus("Please choose a puzzle photo first.", "error");
            return;
          }

          if (!imageValidationPassed) {
            showStatus(
              "Please wait for the image and puzzle-layout checks to finish.",
              "error",
            );
            return;
          }

          if (!turnstileToken) {
            showStatus("Please complete the security check first.", "error");
            return;
          }

          clearPersistentError();

          button.dataset.busy = "true";
          button.textContent = "Reading letters…";
          updateButton();

          showStatus(
            "Preparing your photo and identifying the letters…",
            "info",
          );

          try {
            const imageDataUrl = await prepareImage(selectedFile);

            const response = await fetch(API_URL, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                imageDataUrl,
                turnstileToken,
              }),
            });

            let result;

            try {
              result = await response.json();
            } catch {
              throw new Error(
                "The server response could not be read. Please try again.",
              );
            }

            if (!response.ok) {
              const messages = {
                400: "The request or image could not be processed. Try another photo.",
                403: "The security check failed. Please complete it again.",
                413: "The image is too large. Please choose a smaller photo.",
                429: "The request limit has been reached. Please wait before trying again.",
                503: "The letter-reading service is temporarily unavailable. Try again later.",
              };

              throw new Error(
                messages[response.status] ||
                  result.error ||
                  "Sorry, the request failed. Please try again.",
              );
            }

            const center = String(result.centerLetter || "")
              .trim()
              .toUpperCase();

            const rawOthers = result.otherLetters;
            const others = Array.isArray(rawOthers)
              ? rawOthers.map((letter) => String(letter).trim().toUpperCase())
              : String(rawOthers || "")
                  .toUpperCase()
                  .match(/[A-Z]/g) || [];

            const allLetters = [center, ...others];

            const valid =
              /^[A-Z]$/.test(center) &&
              others.length === 6 &&
              others.every((letter) => /^[A-Z]$/.test(letter)) &&
              new Set(allLetters).size === 7;

            if (!valid) {
              throw new Error(
                "Invalid image (seven)",
                //"The result did not contain seven distinct letters. Try a clearer photo showing all seven hexagons.",
              );
            }

            centerField.value = center;
            otherField.value = others.join(" ");

            showStatus(
              "Letters identified! Please double-check them against your puzzle.",
              "success",
            );
          } catch (error) {
            showStatus(
              error?.message || "Something went wrong. Please try again.",
              "error",
            );
          } finally {
            button.dataset.busy = "false";
            button.textContent = "Identify letters";

            // Turnstile tokens are single-use.
            turnstileToken = "";

            if (window.turnstile && turnstileWidgetId !== null) {
              window.turnstile.reset(turnstileWidgetId);
            }

            updateButton();
          }
        });

        // ------------------------------------------------------------
        // Letter input cleanup
        // ------------------------------------------------------------

        centerField.addEventListener("input", () => {
          centerField.value = centerField.value
            .toUpperCase()
            .replace(/[^A-Z]/g, "")
            .slice(0, 1);
        });

        otherField.addEventListener("input", () => {
          otherField.value = otherField.value
            .toUpperCase()
            .replace(/[^A-Z\s,]/g, "");
        });
      })();
    </script>

    <script>
      window.findValidWords = async function (dictionaryIndex) {
        const centerLetter = document.mainForm.centerLetter.value
          .trim()
          .toLowerCase();

        const otherLetters = document.mainForm.otherLetters.value
          .trim()
          .toLowerCase()
          .replace(/[^a-z]/g, "");

        const allLetters = centerLetter + otherLetters;
        const minLength = parseInt(document.mainForm.minLength.value, 10);

        if (!/^[a-z]$/.test(centerLetter) || otherLetters.length !== 6) {
          alert("Please enter one center letter and six other letters.");
          return;
        }

        try {
          const [selectedDictionary, extraDictionary] = await Promise.all([
            loadDictionaryFile(`dictionary${dictionaryIndex}.txt`),
            loadDictionaryFile("dictionaryExtra.txt"),
          ]);

          const uniqueWords = [
            ...new Set(
              (selectedDictionary + "\n" + extraDictionary)
                .split(/\r?\n/)
                .map((word) => word.toLowerCase().trim())
                .filter(Boolean),
            ),
          ];

          const validWords = uniqueWords
            .filter(
              (word) =>
                word.length >= minLength &&
                word.includes(centerLetter) &&
                [...word].every((letter) => allLetters.includes(letter)),
            )
            .sort();

          let tableHtml = "<table>";

          for (const word of validWords) {
            const isPangram = [...new Set(allLetters)].every((letter) =>
              word.includes(letter),
            );

            tableHtml += `<tr><td>${
              isPangram ? "<b>" + word + "</b>" : word
            }</td></tr>`;
          }

          tableHtml += "</table>";

          document.getElementById("validWordsLabel").textContent =
            " (" + validWords.length + ")";

          document.getElementById("validWordsTable").innerHTML = tableHtml;
        } catch (error) {
          console.error(error);
          alert(
            "Could not load the dictionary files. " +
              "Check the filenames and server.",
          );
        }
      };

      async function loadDictionaryFile(filename) {
        const response = await fetch(filename);

        if (!response.ok) {
          throw new Error(
            `Failed to load ${filename}: HTTP ${response.status}`,
          );
        }

        return await response.text();
      }
    </script>
